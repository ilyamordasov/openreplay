name: Publish group stats fdb71f05 frontend to GHCR

on:
  push:
    branches:
      - ops/publish-group-stats-fdb71f05
    paths:
      - .github/workflows/publish-group-stats-fdb71f05.yml

permissions:
  contents: read
  packages: write

env:
  SOURCE_SHA: fdb71f05248d2127d6e3bbc3831895c1bc8385a6
  SHORT_SHA: fdb71f05
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare frontend build recipe
        shell: bash
        run: |
          set -euo pipefail
          cat > frontend/Dockerfile.registry <<'DOCKERFILE'
          FROM node:24-slim AS builder
          WORKDIR /work
          COPY . .
          RUN cp .env.sample .env
          ARG NODE_OPTIONS="--max-old-space-size=2560"
          ENV NODE_OPTIONS=$NODE_OPTIONS
          ENV PARCEL_WORKERS=0 CYPRESS_INSTALL_BINARY=0 PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          RUN node .yarn/releases/yarn-4.7.0.cjs install --immutable --inline-builds
          RUN node .yarn/releases/yarn-4.7.0.cjs run build
          RUN test -s public/index.html

          FROM public.ecr.aws/nginx/nginx-unprivileged:stable-alpine
          ARG GIT_SHA
          LABEL GIT_SHA=$GIT_SHA
          LABEL org.opencontainers.image.source=https://github.com/ilyamordasov/openreplay
          LABEL org.opencontainers.image.revision=$GIT_SHA
          COPY --from=builder /work/public /var/www/openreplay
          COPY nginx.conf /etc/nginx/conf.d/default.conf
          ENV GIT_SHA=$GIT_SHA
          EXPOSE 8080
          DOCKERFILE

      - name: Build and push frontend
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/openreplay-frontend"
          docker buildx build             --platform linux/amd64             --file frontend/Dockerfile.registry             --build-arg GIT_SHA="${SOURCE_SHA}"             --build-arg NODE_OPTIONS=--max-old-space-size=2560             --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"             --label "org.opencontainers.image.revision=${SOURCE_SHA}"             --tag "${IMAGE}:group-stats-${SHORT_SHA}"             --tag "${IMAGE}:sha-${SOURCE_SHA}"             --provenance=false             --push             --metadata-file /tmp/image-metadata.json             frontend
          DIGEST="$(jq -r '."containerimage.digest"' /tmp/image-metadata.json)"
          test -n "$DIGEST"
          echo "${IMAGE}@${DIGEST}" | tee registry-image.txt

      - name: Upload registry digest
        uses: actions/upload-artifact@v4
        with:
          name: group-stats-frontend-registry-image
          path: registry-image.txt
          if-no-files-found: error
