name: Publish main c3bc1433 images to GHCR

on:
  push:
    branches:
      - ops/publish-main-c3bc1433
    paths:
      - .github/workflows/publish-main-c3bc1433.yml

permissions:
  contents: read
  packages: write

env:
  SOURCE_SHA: c3bc1433a5e8fa440791dbf757b8ae8a460ed7e6
  SHORT_SHA: c3bc1433
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - frontend

    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare API build recipe
        if: matrix.service == 'api'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("backend/Dockerfile")
          source = p.read_text()
          old = "CGO_ENABLED=1 GOOS=linux GOARCH=$ARCH go build -o service"
          new = "GOMAXPROCS=2 GOMEMLIMIT=1536MiB CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -p 1 -v -mod=readonly -o service"
          if source.count(old) != 1:
              raise SystemExit("unexpected backend Dockerfile build command")
          Path("backend/Dockerfile.registry").write_text(source.replace(old, new, 1))
          PY

      - name: Prepare frontend build recipe
        if: matrix.service == 'frontend'
        shell: bash
        run: |
          set -euo pipefail
          cat > frontend/Dockerfile.registry <<'DOCKERFILE'
          FROM node:24-slim AS builder
          WORKDIR /work
          COPY . .
          RUN cp .env.sample .env
          ARG NODE_OPTIONS="--max-old-space-size=2560"
          ENV NODE_OPTIONS=$NODE_OPTIONS
          ENV PARCEL_WORKERS=0 CYPRESS_INSTALL_BINARY=0 PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          RUN node .yarn/releases/yarn-4.7.0.cjs install --immutable --inline-builds
          RUN node .yarn/releases/yarn-4.7.0.cjs run build
          RUN test -s public/index.html

          FROM public.ecr.aws/nginx/nginx-unprivileged:stable-alpine
          ARG GIT_SHA
          LABEL GIT_SHA=$GIT_SHA
          LABEL org.opencontainers.image.source=https://github.com/ilyamordasov/openreplay
          LABEL org.opencontainers.image.revision=$GIT_SHA
          COPY --from=builder /work/public /var/www/openreplay
          COPY nginx.conf /etc/nginx/conf.d/default.conf
          ENV GIT_SHA=$GIT_SHA
          EXPOSE 8080
          DOCKERFILE

      - name: Build and push API
        if: matrix.service == 'api'
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/openreplay-api"
          docker buildx build \
            --platform linux/amd64 \
            --file backend/Dockerfile.registry \
            --build-arg SERVICE_NAME=api \
            --build-arg GIT_SHA="${SOURCE_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --tag "${IMAGE}:main-${SHORT_SHA}" \
            --tag "${IMAGE}:sha-${SOURCE_SHA}" \
            --provenance=false \
            --push \
            --metadata-file /tmp/image-metadata.json \
            backend
          DIGEST="$(jq -r '."containerimage.digest"' /tmp/image-metadata.json)"
          test -n "$DIGEST"
          echo "${IMAGE}@${DIGEST}" | tee registry-image.txt
          echo "### API" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push frontend
        if: matrix.service == 'frontend'
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/openreplay-frontend"
          docker buildx build \
            --platform linux/amd64 \
            --file frontend/Dockerfile.registry \
            --build-arg GIT_SHA="${SOURCE_SHA}" \
            --build-arg NODE_OPTIONS=--max-old-space-size=2560 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --tag "${IMAGE}:main-${SHORT_SHA}" \
            --tag "${IMAGE}:sha-${SOURCE_SHA}" \
            --provenance=false \
            --push \
            --metadata-file /tmp/image-metadata.json \
            frontend
          DIGEST="$(jq -r '."containerimage.digest"' /tmp/image-metadata.json)"
          test -n "$DIGEST"
          echo "${IMAGE}@${DIGEST}" | tee registry-image.txt
          echo "### Frontend" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload registry digest
        uses: actions/upload-artifact@v4
        with:
          name: main-${{ matrix.service }}-registry-image
          path: registry-image.txt
          if-no-files-found: error
