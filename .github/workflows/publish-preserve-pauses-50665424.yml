name: Publish preserve pauses 50665424 API to GHCR

on:
  push:
    branches:
      - ops/publish-preserve-pauses-50665424
    paths:
      - .github/workflows/publish-preserve-pauses-50665424.yml

permissions:
  contents: read
  packages: write

env:
  SOURCE_SHA: 506654243d9cbd162c1219640f77a84c4fcd9942
  SHORT_SHA: 50665424
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare API build recipe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("backend/Dockerfile")
          source = p.read_text()
          old = "CGO_ENABLED=1 GOOS=linux GOARCH=$ARCH go build -o service"
          new = "GOMAXPROCS=2 GOMEMLIMIT=1536MiB CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -p 1 -v -mod=readonly -o service"
          if source.count(old) != 1:
              raise SystemExit("unexpected backend Dockerfile build command")
          Path("backend/Dockerfile.registry").write_text(source.replace(old, new, 1))
          PY

      - name: Build and push API
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/openreplay-api"
          docker buildx build             --platform linux/amd64             --file backend/Dockerfile.registry             --build-arg SERVICE_NAME=api             --build-arg GIT_SHA="${SOURCE_SHA}"             --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"             --label "org.opencontainers.image.revision=${SOURCE_SHA}"             --tag "${IMAGE}:preserve-pauses-${SHORT_SHA}"             --tag "${IMAGE}:sha-${SOURCE_SHA}"             --provenance=false             --push             --metadata-file /tmp/image-metadata.json             backend
          DIGEST="$(jq -r '."containerimage.digest"' /tmp/image-metadata.json)"
          test -n "$DIGEST"
          echo "${IMAGE}@${DIGEST}" | tee registry-image.txt
          echo "### API" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload registry digest
        uses: actions/upload-artifact@v4
        with:
          name: preserve-pauses-api-registry-image
          path: registry-image.txt
          if-no-files-found: error
